services:
  everyday_shop_app:
    image: shazimali/everyday-shop:latest
    container_name: everyday_shop_app
    restart: always
    env_file:
      - /var/www/everyday_shop/.env
    environment:
      # Override to connect to shared Redis on global_network (127.0.0.1 in .env is overridden here)
      REDIS_HOST: everyday_redis
      REDIS_PORT: 6379
      REDIS_DB: 2          # other project uses DB=0 and DB=1 — keep isolated
      REDIS_CACHE_DB: 3
      REDIS_PREFIX: eshop_
    ports:
      - "8080:80"
    networks:
      - global_network
    volumes:
      - everyday_shop_storage:/var/www/everyday_shop/storage
      - everyday_shop_cache:/var/www/everyday_shop/bootstrap/cache
      - /var/www/everyday_shop/.env:/var/www/everyday_shop/.env
    depends_on:
      - everyday_redis

  everyday_shop_worker:
    image: shazimali/everyday-shop:latest
    container_name: everyday_shop_worker
    restart: always
    command: ["php", "artisan", "horizon"]
    env_file:
      - /var/www/everyday_shop/.env
    environment:
      # Override to connect to shared Redis on global_network (127.0.0.1 in .env is overridden here)
      REDIS_HOST: everyday_redis
      REDIS_PORT: 6379
      REDIS_DB: 2          # other project uses DB=0 and DB=1 — keep isolated
      REDIS_CACHE_DB: 3
      REDIS_PREFIX: eshop_
    networks:
      - global_network
    volumes:
      - everyday_shop_storage:/var/www/everyday_shop/storage
      - everyday_shop_cache:/var/www/everyday_shop/bootstrap/cache
      - /var/www/everyday_shop/.env:/var/www/everyday_shop/.env
    depends_on:
      - everyday_shop_app
      - everyday_redis

  # Shared Redis container on global_network.
  # If already running from the other project's docker-compose, Docker will
  # reuse the existing container — no conflict. If starting fresh on this VPS,
  # this definition will create it.
  everyday_redis:
    image: redis:alpine
    container_name: everyday_redis
    restart: always
    networks:
      - global_network
    volumes:
      - everyday_redis_data:/data

networks:
  global_network:
    external: true

volumes:
  everyday_shop_storage:
    external: true
    name: everyday_shop_storage      # ← forces exact volume name, no prefix
  everyday_shop_cache:
    name: everyday_shop_cache        # ← forces exact volume name, no prefix
  everyday_redis_data:
    external: true
    name: everyday_redis_data        # ← must match the name used in the other project