services:
  everyday_shop_app:
    image: shazimali/everyday-shop:latest
    container_name: everyday_shop_app
    restart: always
    env_file:
      - /var/www/everyday_shop/.env
    environment:
      # Connect to shared Redis container running on global_network
      REDIS_HOST: everyday_redis
      REDIS_PORT: 6379
      REDIS_DB: 2          # other project uses DB=0 and DB=1 — keep isolated
      REDIS_CACHE_DB: 3
      REDIS_PREFIX: eshop_
    ports:
      - "8080:80"
    networks:
      - global_network
    volumes:
      - everyday_shop_storage:/var/www/everyday_shop/storage
      - everyday_shop_cache:/var/www/everyday_shop/bootstrap/cache
      - /var/www/everyday_shop/.env:/var/www/everyday_shop/.env

  everyday_shop_worker:
    image: shazimali/everyday-shop:latest
    container_name: everyday_shop_worker
    restart: always
    command: ["php", "artisan", "horizon"]
    env_file:
      - /var/www/everyday_shop/.env
    environment:
      # Connect to shared Redis container running on global_network
      REDIS_HOST: everyday_redis
      REDIS_PORT: 6379
      REDIS_DB: 2          # other project uses DB=0 and DB=1 — keep isolated
      REDIS_CACHE_DB: 3
      REDIS_PREFIX: eshop_
    networks:
      - global_network
    volumes:
      - everyday_shop_storage:/var/www/everyday_shop/storage
      - everyday_shop_cache:/var/www/everyday_shop/bootstrap/cache
      - /var/www/everyday_shop/.env:/var/www/everyday_shop/.env
    depends_on:
      - everyday_shop_app

networks:
  global_network:
    external: true

volumes:
  everyday_shop_storage:
    external: true
    name: everyday_shop_storage      # ← Persistent storage volume for images/uploads (SAFE & PROTECTED)
  everyday_shop_cache:
    name: everyday_shop_cache        # ← Application bootstrap cache